services:
  backend:
    build: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"
    networks:
      - superkart-net

  frontend:
    build: ./frontend_files
    container_name: superkart-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      - backend
    networks:
      - superkart-net

networks:
  superkart-net:
    driver: bridge
